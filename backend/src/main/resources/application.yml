server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tradeverity-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tradeverity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERINGS=HIGH;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tradeverity}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:tradeverity_user}
    password: ${DB_PASSWORD:TradeVerity_Secure_Pass2026!}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

tradeverity:
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:}
    mock-enabled: true
  analysis:
    thread-pool-size: 4
